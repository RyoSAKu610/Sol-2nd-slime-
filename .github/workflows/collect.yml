# GHA free-tier collection: single radar pass every 15 minutes.
# PAPER only; no live trading, no external repo creation, no Secrets registration.
# Nansen key is never set here: missing_credential path keeps free DEX collection only.
# State (.gha_state) is restored from the Actions cache so paper history survives between runs.
name: collect

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

# collect and share share one group: never two radar passes on the same cached state.
concurrency:
  group: gha-radar-state
  cancel-in-progress: false

jobs:
  collect-once:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NANSEN_API_KEY: ""
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      # Restore before the pass; actions/cache saves .gha_state in its post-step.
      - name: Restore GHA radar state (.gha_state)
        uses: actions/cache@v6
        with:
          path: .gha_state
          key: gha-state-${{ github.run_id }}
          restore-keys: gha-state-
      # continue-on-error keeps the post-pass work (prune, snapshot, artifact, cache save) alive
      # when the pass exits 1 on a transient DEX fetch error. The step still shows as a
      # failure/warning annotation, and runtime_error is printed on stdout, so the job is
      # marked as a warning rather than quietly passing. Nothing else is swallowed: if the
      # state DB was never created (first run failing outright), the snapshot step below
      # fails as it should.
      - name: Single radar pass only (non-interactive once)
        continue-on-error: true
        run: python3 -m radar --state .gha_state --config radar/config.gha.json once
      # Bound cache growth: observations only, newest 5,000 rows. trades/tokens/feeds/kv stay.
      - name: Prune + checkpoint state before caching
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from radar.store import Store
          s = Store(Path('.gha_state/radar.sqlite3'))
          print('pruned_observations', s.prune_observations(5000))
          s.close()
          import sqlite3
          c = sqlite3.connect('.gha_state/radar.sqlite3')
          print('wal_checkpoint', c.execute('PRAGMA wal_checkpoint(TRUNCATE)').fetchone())
          for table in ('observations', 'trades', 'tokens'):
              print('rows_' + table, c.execute('SELECT COUNT(*) FROM ' + table).fetchone()[0])
          c.close()
          total = sum(p.stat().st_size for p in Path('.gha_state').rglob('*') if p.is_file())
          print('gha_state_bytes', total)
          PY
      - name: Build slim snapshot (<1MB, read-only, no payload)
        run: python3 -m radar.gha_snapshot --db .gha_state/radar.sqlite3 --out slim-fragment.json --config radar/config.gha.json
      - name: Enforce slim size limit
        run: python3 -c "import pathlib; size=pathlib.Path('slim-fragment.json').stat().st_size; assert size < 1048576, size; print('slim bytes:', size)"
      - uses: actions/upload-artifact@v7
        with:
          name: slim-fragment
          path: slim-fragment.json
          retention-days: 7
